
name: Build JARVIS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate Android project around index.html
        run: |
          set -e
          test -f index.html
          mkdir -p app/src/main/assets app/src/main/java/com/rexy/jarvis
          cp index.html app/src/main/assets/index.html
 
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Jarvis"
          include ':app'
          EOF
 
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
 
          cat > gradle.properties <<'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2g
          EOF
 
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.rexy.jarvis'
            compileSdk 34
            defaultConfig {
              applicationId 'com.rexy.jarvis'
              minSdk 26
              targetSdk 33
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          EOF
 
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent><intent><action android:name="android.speech.RecognitionService"/></intent></queries>
            <application android:label="JARVIS" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
 
          cat > app/src/main/java/com/rexy/jarvis/MainActivity.java <<'EOF'
          package com.rexy.jarvis;
 
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.ArrayList;
          import java.util.Locale;
          import org.json.JSONObject;
 
          public class MainActivity extends Activity {
            private WebView web;
            private TextToSpeech tts;
            private boolean ttsReady = false;
            private SpeechRecognizer sr;
            private String mode = "cmd";
 
            private void js(final String code) {
              runOnUiThread(new Runnable() {
                public void run() { web.evaluateJavascript(code, null); }
              });
            }
 
            private void sttErr(int code) {
              js("window.nativeSttErr&&window.nativeSttErr(" + code + "," + JSONObject.quote(mode) + ")");
            }
 
            public class Bridge {
              @JavascriptInterface
              public void speak(final String text, final boolean hindi) {
                runOnUiThread(new Runnable() {
                  public void run() {
                    if (!ttsReady) { js("window.nativeTtsDone&&window.nativeTtsDone()"); return; }
                    tts.setLanguage(hindi ? new Locale("hi", "IN") : Locale.UK);
                    tts.setPitch(0.85f);
                    tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis");
                  }
                });
              }
 
              @JavascriptInterface
              public void stop() {
                runOnUiThread(new Runnable() {
                  public void run() { if (ttsReady) tts.stop(); }
                });
              }
 
              @JavascriptInterface
              public void listen(final boolean hindi, final String m) {
                runOnUiThread(new Runnable() {
                  public void run() {
                    mode = m;
                    if (!SpeechRecognizer.isRecognitionAvailable(MainActivity.this)) { sttErr(-1); return; }
                    if (sr == null) {
                      sr = SpeechRecognizer.createSpeechRecognizer(MainActivity.this);
                      sr.setRecognitionListener(new RecognitionListener() {
                        public void onReadyForSpeech(android.os.Bundle b) {}
                        public void onBeginningOfSpeech() {}
                        public void onRmsChanged(float v) {}
                        public void onBufferReceived(byte[] b) {}
                        public void onEndOfSpeech() {}
                        public void onPartialResults(android.os.Bundle b) {}
                        public void onEvent(int t, android.os.Bundle b) {}
                        public void onError(int e) { sttErr(e); }
                        public void onResults(android.os.Bundle b) {
                          ArrayList<String> l = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          String t = (l != null && !l.isEmpty()) ? l.get(0) : "";
                          js("window.nativeStt&&window.nativeStt(" + JSONObject.quote(t) + "," + JSONObject.quote(mode) + ")");
                        }
                      });
                    }
                    Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                    i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                    i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, hindi ? "hi-IN" : "en-IN");
                    sr.cancel();
                    sr.startListening(i);
                  }
                });
              }
 
              @JavascriptInterface
              public void stopListen() {
                runOnUiThread(new Runnable() {
                  public void run() { if (sr != null) sr.cancel(); }
                });
              }
            }
 
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public void onPermissionRequest(final PermissionRequest request) {
                  runOnUiThread(new Runnable() {
                    public void run() { request.grant(request.getResources()); }
                  });
                }
              });
              web.addJavascriptInterface(new Bridge(), "JarvisNative");
              tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                public void onInit(int status) { ttsReady = (status == TextToSpeech.SUCCESS); }
              });
              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                public void onStart(String id) { js("window.nativeTtsStart&&window.nativeTtsStart()"); }
                public void onDone(String id) { js("window.nativeTtsDone&&window.nativeTtsDone()"); }
                public void onError(String id) { js("window.nativeTtsDone&&window.nativeTtsDone()"); }
              });
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
              }
              web.loadUrl("file:///android_asset/index.html");
            }
 
            @Override
            protected void onDestroy() {
              if (tts != null) { tts.stop(); tts.shutdown(); }
              if (sr != null) { sr.destroy(); }
              super.onDestroy();
            }
 
            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
 
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
 
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs
